name: Bug report
description: Report a reproducible CLI or hook problem without private data
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Please use a synthetic reproduction. Do not include API keys, raw prompts,
        hook payloads, client code, private paths, or unredacted logs.
  - type: input
    id: version
    attributes:
      label: JevCompass version
      placeholder: "0.1.9"
    validations:
      required: true
  - type: dropdown
    id: host
    attributes:
      label: Codex host
      options:
        - Desktop on Linux
        - Desktop on macOS
        - CLI on Linux
        - CLI on macOS
        - Other
    validations:
      required: true
  - type: input
    id: codex-version
    attributes:
      label: Codex and Python versions
      placeholder: "Codex CLI 0.155.1; Python 3.14"
  - type: textarea
    id: reproduce
    attributes:
      label: Synthetic reproduction
      description: Steps using only public or synthetic data.
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
      description: Include only a redacted doctor status or safe category/status metric if helpful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
